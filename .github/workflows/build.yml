name: Youtube JOMB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Construir instalador Windows
    runs-on: windows-latest

    steps:
    - name: Checkout (obtener código)
      uses: actions/checkout@v4

    - name: Leer VERSION
      id: get_version
      shell: pwsh
      run: |
        if (-not (Test-Path VERSION)) { Write-Error "Falta archivo VERSION en la raíz (ej: 1.2.1)"; exit 1 }
        $v = (Get-Content VERSION -Raw).Trim()
        if (-not $v) { Write-Error "El archivo VERSION está vacío"; exit 1 }
        echo "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Usando VERSION: $v"

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Instalar dependencias (pip) y PyInstaller
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        if (Test-Path requirements.txt) { pip install -r requirements.txt } else { Write-Host "No hay requirements.txt; instalando pyinstaller únicamente" }
        pip install pyinstaller

    - name: Limpiar artefactos previos
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
        Remove-Item -Force *.spec -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force installer -ErrorAction SilentlyContinue

    - name: Construir exe con PyInstaller (genera solo el Youtube_JOMB.exe)
      shell: pwsh
      run: |
        pyinstaller --onefile --windowed --icon=icono.ico youtube.py

    - name: Verificar exe (dist\youtube.exe)
      shell: pwsh
      run: |
        if (-not (Test-Path .\dist\youtube.exe)) {
          Write-Host "Listado carpeta dist:"; Get-ChildItem -Force dist -ErrorAction SilentlyContinue
          Write-Error "No se generó dist\\youtube.exe. Revisa PyInstaller o el nombre del script."
        } else {
          Write-Host "dist\\youtube.exe generado correctamente."
        }

    - name: Crear carpeta installer (asegurar)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path installer | Out-Null

    - name: Instalar Inno Setup (choco)
      shell: pwsh
      run: choco install innosetup -y

    - name: Ejecutar Inno Setup (ISCC) con la versión
      shell: pwsh
      run: |
        $ver = "${{ steps.get_version.outputs.version }}"
        Write-Host "Compilando instalador con MyAppVersion=$ver"
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { Write-Error "ISCC.exe no encontrado en $iscc"; exit 1 }
        # Ejecutamos el .iss (que debe apuntar a dist\youtube.exe); además le pasamos la versión por variable preproc
        & $iscc installer_script.iss "/DMyAppVersion=$ver"

    - name: Mostrar carpeta installer (debug)
      shell: pwsh
      run: |
        if (Test-Path installer) { Get-ChildItem installer -Force } else { Write-Host "No existe carpeta installer/" }

    - name: Crear Release y subir instalador
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        artifacts: installer/Youtube-JOMB_${{ steps.get_version.outputs.version }}.exe
        allowUpdates: true
        replacesArtifacts: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
