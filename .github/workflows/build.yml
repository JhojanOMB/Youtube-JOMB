name: Youtube JOMB

# Ejecuta en cada push a main o manualmente desde Actions
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permitimos que el workflow escriba contenido (necesario para crear releases/tags)
permissions:
  contents: write

jobs:
  build-win:
    name: Construir instalador Windows
    runs-on: windows-latest

    steps:
    # ---- 1) Obtener el código ----
    - name: Checkout (obtener código)
      uses: actions/checkout@v3

    # ---- 2) Leer VERSION (archivo en la raíz) ----
    - name: Obtener versión desde archivo VERSION
      id: get_version
      shell: pwsh
      run: |
        $v = (Get-Content VERSION -Raw).Trim()
        if (-not $v) { Write-Error "El archivo VERSION está vacío o no existe" }
        echo "version=$v" >> $env:GITHUB_OUTPUT

    # ---- 3) Preparar Python ----
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # ---- 4) Instalar dependencias de Python ----
    - name: Instalar dependencias (pip) y PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # ---- 5) Incrustar versión en un archivo para que el exe la tenga ----
    - name: Embed version into source (version.py)
      shell: pwsh
      run: |
        $v = "${{ steps.get_version.outputs.version }}"
        Write-Host "Embedding version $v into version.py"
        "VERSION = '$v'" | Out-File -Encoding UTF8 version.py

    # ---- 6) Limpiar builds anteriores (opcional pero recomendado) ----
    - name: Limpiar build/dist anteriores
      shell: pwsh
      run: |
        Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
        Remove-Item -Force *.spec -ErrorAction SilentlyContinue

    # ---- 7) Construir .exe con PyInstaller ----
    - name: Construir exe con PyInstaller
      run: |
        pyinstaller --onefile --windowed --icon=icono.ico youtube.py

    # ---- 8) Mostrar archivos generados (debug) ----
    - name: Listar dist/ y archivos
      run: |
        dir dist
        dir
      shell: pwsh

    # ---- 9) Instalar Inno Setup (choco) ----
    - name: Instalar Inno Setup (choco)
      run: choco install innosetup -y

    # ---- 10) Construir el instalador con Inno Setup ----
    - name: Construir instalador con Inno Setup
      shell: pwsh
      run: |
        $ver = "${{ steps.get_version.outputs.version }}"
        Write-Host "Construyendo instalador versión $ver"
        # Ejecutamos ISCC (asegúrate que installer_script.iss está en la raíz del repo)
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_script.iss "/DMyAppVersion=$ver"

    # ---- 11) Verificar que el instalador existe (si no existe fallamos el job) ----
    - name: Verificar instalador creado
      shell: pwsh
      run: |
        $ver = "${{ steps.get_version.outputs.version }}"
        $installer = "installer\YouTubeDownloaderSetup_$ver.exe"
        Write-Host "Buscando instalador en: $installer"
        if (-not (Test-Path $installer)) {
          Write-Host "ERROR: No se encontró instalador en $installer"
          Write-Host "Contenido de la carpeta installer (si existe):"
          if (Test-Path "installer") {
            Get-ChildItem -Path installer -Force -Recurse | Format-List
          } else {
            Write-Host "La carpeta installer no existe."
          }
          Write-Error "Instalador no encontrado. Fallando el job."
        } else {
          Write-Host "Instalador encontrado: $installer"
        }

    # ---- 12) Crear Release en GitHub y subir SOLO el instalador ----
    - name: Crear Release y subir instalador
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ steps.get_version.outputs.version }}
        name: Release v${{ steps.get_version.outputs.version }}
        files: installer/YouTubeDownloaderSetup_${{ steps.get_version.outputs.version }}.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
